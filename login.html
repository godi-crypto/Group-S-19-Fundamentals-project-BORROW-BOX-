<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Sign In | BorrowBox</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2">
            <div class="rounded-4 p-2 d-flex align-items-center justify-content-center text-white"
                 style="width: 52px; height: 52px; background-color: #115e3b;">
              <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
          </a>
          <h1 class="h3 fw-bold mt-3" style="color: #0b3c29;">Welcome to BorrowBox</h1>
          <p class="text-secondary small">What You Need, When You Need It.</p>
        </div>

        <!-- Login Card -->
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
          <h5 class="fw-bold mb-3">Sign in to your account</h5>
          
          <form id="loginForm" action="index.html" method="get">
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold">Campus Email or Student ID</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                <input type="text" class="form-control bg-light border-start-0" id="email" placeholder="e.g. godi.donald@student.ac.ug" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <a href="#" class="small text-success text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="password" placeholder="Enter your password" required>
              </div>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label small text-secondary" for="rememberMe">Remember me on this device</label>
            </div>

            <button type="submit" class="btn btn-success w-100 py-3 fw-semibold shadow-sm mb-3" style="background-color: #115e3b;">
              Sign In
            </button>
            
            <div class="text-center">
              <small class="text-secondary">Don't have an account? <a href="#" class="text-success fw-semibold text-decoration-none">Register here</a></small>
            </div>
          </form>
        </div>

        <div class="text-center mt-4 text-muted small">
          &copy; 2026 BorrowBox Campus Community. All rights reserved.
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", () => {
      const loginName = document.getElementById("email").value.trim();
      const profileName = loginName.includes("@") ? loginName.split("@")[0] : loginName;
      sessionStorage.setItem("borrowboxLoginName", profileName);
    });
  </script>
</body>
</html>
