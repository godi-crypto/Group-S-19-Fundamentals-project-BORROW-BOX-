<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate & Review - BorrowBox</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div id="navbar"></div>

<main class="container my-5">

    <!-- RATE AND REVIEW CARD -->
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">

        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Rate & Review</h4>
        </div>

        <div class="card-body">

            <p class="text-secondary">
                Share your experience with the item you borrowed.
            </p>

            <!-- Item name -->
            <label class="form-label">Item Name</label>
            <input type="text" class="form-control mb-3"
                   value="Casio FX-991ES Plus" readonly>

            <!-- Star rating -->
            <label class="form-label">Your Rating</label>

            <div class="mb-3">
                <input type="radio" class="btn-check" name="rating" id="star1" value="1">
                <label class="btn btn-outline-warning" for="star1">★</label>

                <input type="radio" class="btn-check" name="rating" id="star2" value="2">
                <label class="btn btn-outline-warning" for="star2">★★</label>

                <input type="radio" class="btn-check" name="rating" id="star3" value="3">
                <label class="btn btn-outline-warning" for="star3">★★★</label>

                <input type="radio" class="btn-check" name="rating" id="star4" value="4">
                <label class="btn btn-outline-warning" for="star4">★★★★</label>

                <input type="radio" class="btn-check" name="rating" id="star5" value="5">
                <label class="btn btn-outline-warning" for="star5">★★★★★</label>
            </div>

            <!-- Review comment -->
            <label class="form-label">Your Comment</label>
            <textarea class="form-control mb-3" rows="4"
                      placeholder="Write your experience here..."></textarea>

            <!-- Buttons -->
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#reviewConfirmation">
                Submit Review
            </button>

            <a href="borrowings.html" class="btn btn-secondary">
                Cancel
            </a>

        </div>
    </div>

</main>

<div class="modal fade" id="reviewConfirmation" tabindex="-1" aria-labelledby="reviewConfirmationTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewConfirmationTitle">Review submitted</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Thank you. Your rating and review have been submitted successfully.</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);
                if (response.ok) document.getElementById(id).innerHTML = await response.text();
            } catch (error) {
                console.error(`Error loading ${file}:`, error);
            }
        }

        await loadComponent("navbar", "navbar.html");
        const loginProfileName = sessionStorage.getItem("borrowboxLoginName");
        const profileNameElement = document.querySelector("#navbar [data-profile-name]");
                if (loginProfileName && profileNameElement) {
                    profileNameElement.textContent = loginProfileName;
                    const profileInitialElement = document.querySelector("#navbar [data-profile-initial]");
                    if (profileInitialElement) profileInitialElement.textContent = loginProfileName.trim().charAt(0).toUpperCase();
                }
        document.querySelector('#navbar a[href="login.html"]')?.addEventListener("click", () => sessionStorage.removeItem("borrowboxLoginName"));
        await loadComponent("footer", "footer.html");
    });
</script>

</body>
</html>
