<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request to Borrow - BorrowBox</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div id="navbar"></div>

<main class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">

        <!-- Form Heading -->
        <div class="card-header bg-success text-white p-3">
            <h4 class="mb-1">Request to Borrow</h4>
            <small>Complete the form to request this item.</small>
        </div>

        <div class="card-body p-4">

            <form id="borrowRequestForm">

                <!-- Item Details -->
                <h5 class="text-success mb-3">Item Details</h5>

                <div class="mb-3">
                    <label class="form-label">Item Name</label>
                    <input type="text" class="form-control"
                        value="Casio FX-991ES Plus" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Item Owner</label>
                    <input type="text" class="form-control"
                        value="Ahabwe B." readonly>
                </div>

                <hr>

                <!-- Borrower Details -->
                <h5 class="text-success mb-3">Borrower Information</h5>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control"
                        placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Student ID / Registration Number</label>
                    <input type="text" class="form-control"
                        placeholder="Enter your student ID" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control"
                        placeholder="e.g. 07XXXXXXXX" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control"
                        placeholder="Enter your email" required>
                </div>

                <hr>

                <!-- Borrowing Period -->
                <h5 class="text-success mb-3">Borrowing Details</h5>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Collection Date</label>
                        <input type="date" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Expected Return Date</label>
                        <input type="date" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Purpose of Borrowing</label>
                    <textarea class="form-control" rows="3"
                        placeholder="Briefly explain why you need this item..."
                        required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Additional Message to Owner (Optional)</label>
                    <textarea class="form-control" rows="2"
                        placeholder="Any additional information for the owner..."></textarea>
                </div>

                <!-- Agreement -->
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox"
                        id="agreement" required>
                    <label class="form-check-label" for="agreement">
                        I agree to take good care of the item and return it
                        on the agreed date.
                    </label>
                </div>

                <!-- Form Buttons -->
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-success">
                        Submit Borrow Request
                    </button>

                    <a href="index.html" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</main>

<div class="modal fade" id="requestSubmittedModal" tabindex="-1" aria-labelledby="requestSubmittedTitle" aria-describedby="requestSubmittedMessage" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="requestSubmittedTitle">Request submitted</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="requestSubmittedMessage">
                Your request has been submitted and is awaiting the lender's approval.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);
                if (response.ok) document.getElementById(id).innerHTML = await response.text();
            } catch (error) {
                console.error(`Error loading ${file}:`, error);
            }
        }

        await loadComponent("navbar", "navbar.html");
        const loginProfileName = sessionStorage.getItem("borrowboxLoginName");
        const profileNameElement = document.querySelector("#navbar [data-profile-name]");
                if (loginProfileName && profileNameElement) {
                    profileNameElement.textContent = loginProfileName;
                    const profileInitialElement = document.querySelector("#navbar [data-profile-initial]");
                    if (profileInitialElement) profileInitialElement.textContent = loginProfileName.trim().charAt(0).toUpperCase();
                }
        document.querySelector('#navbar a[href="login.html"]')?.addEventListener("click", () => sessionStorage.removeItem("borrowboxLoginName"));
        await loadComponent("footer", "footer.html");

        document.getElementById("borrowRequestForm").addEventListener("submit", (event) => {
            event.preventDefault();
            bootstrap.Modal.getOrCreateInstance(document.getElementById("requestSubmittedModal")).show();
        });
    });
</script>

</body>
</html>
