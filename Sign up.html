<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | BorrowBox</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <!-- SIGN UP FORM -->
    <div class="container d-flex justify-content-center py-5">

        <div class="card shadow w-100" style="max-width: 550px;">

            <div class="card-body p-4">

                <!-- HEADING -->
                <div class="text-center mb-4">

                    <i class="bi bi-person-plus-fill text-success display-4"></i>

                    <h2 class="fw-bold mt-2">Create an Account</h2>

                    <p class="text-secondary">
                        Join BorrowBox and start borrowing or lending items.
                    </p>

                </div>


                <!-- REGISTRATION FORM -->
                <form id="signUpForm" action="index.html" method="GET">

                    <!-- FULL NAME -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Full Name
                        </label>

                        <input id="fullName" type="text" class="form-control"
                            placeholder="Enter your full name" required>

                    </div>


                    <!-- UNIVERSITY -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            University
                        </label>

                        <input type="text" class="form-control"
                            placeholder="Enter your university name" required>

                    </div>


                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input type="email" class="form-control"
                            placeholder="Enter your email address" required>

                    </div>


                    <!-- PHONE NUMBER -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Phone Number
                        </label>

                        <input type="tel" class="form-control"
                            placeholder="Enter your phone number" required>

                    </div>


                    <!-- PASSWORD -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input type="password" class="form-control"
                            placeholder="Create a password" required>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <input type="password" class="form-control"
                            placeholder="Confirm your password" required>

                    </div>


                    <!-- TERMS AND CONDITIONS -->
                    <div class="form-check mb-4">

                        <input class="form-check-input" type="checkbox"
                            id="terms" required>

                        <label class="form-check-label" for="terms">
                            I agree to the BorrowBox Terms and Conditions.
                        </label>

                    </div>


                    <!-- CREATE ACCOUNT BUTTON -->
                    <button type="submit" class="btn btn-success w-100">
                        Create Account
                    </button>

                </form>


                <!-- SIGN IN LINK -->
                <div class="text-center mt-4">

                    <p>
                        Already have an account?

                        <a href="login.html"
                            class="text-success fw-bold text-decoration-none">
                            Sign In
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="text-center py-3">

        <p class="text-secondary small">
            &copy; 2026 BorrowBox. What You Need, When You Need It.
        </p>

    </footer>

    <script>
        document.getElementById("signUpForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const fullName = document.getElementById("fullName").value.trim();
            sessionStorage.setItem("borrowboxLoginName", fullName);
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
