<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | BorrowBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    
    <div class="container d-flex justify-content-center py-5">
        <div class="w-100" style="max-width: 550px;">

            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2">
                    <div class="rounded-4 p-2 d-flex align-items-center justify-content-center text-white"
                         style="width: 52px; height: 52px; background-color: #115e3b;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                            <line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                    </div>
                </a>
                <h1 class="h3 fw-bold mt-3" style="color: #0b3c29;">Welcome to BorrowBox</h1>
                <p class="text-secondary small">What You Need, When You Need It.</p>
            </div>

        <div class="card shadow w-100">

            <div class="card-body p-4">

                
                <div class="text-center mb-4">

                    <i class="bi bi-person-plus-fill text-success display-4"></i>

                    <h2 class="fw-bold mt-2">Create an Account</h2>

                    <p class="text-secondary">
                        Join BorrowBox and start borrowing or lending items.
                    </p>

                </div>


                
                <form id="signUpForm" action="index.html" method="GET">

                    
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Full Name
                        </label>

                        <input id="fullName" type="text" class="form-control"
                            placeholder="Enter your full name" required>

                    </div>


                    
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            University
                        </label>

                        <input type="text" class="form-control"
                            placeholder="Enter your university name" required>

                    </div>


                    
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input type="email" class="form-control"
                            placeholder="Enter your email address" required>

                    </div>


                    
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Phone Number
                        </label>

                        <input type="tel" class="form-control"
                            placeholder="Enter your phone number" required>

                    </div>


                    
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input type="password" class="form-control"
                            placeholder="Create a password" required>

                    </div>


                    
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <input type="password" class="form-control"
                            placeholder="Confirm your password" required>

                    </div>


                    
                    <div class="form-check mb-4">

                        <input class="form-check-input" type="checkbox"
                            id="terms" required>

                        <label class="form-check-label" for="terms">
                            I agree to the BorrowBox Terms and Conditions.
                        </label>

                    </div>


                    
                    <button type="submit" class="btn btn-success w-100">
                        Create Account
                    </button>

                </form>


                
                <div class="text-center mt-4">

                    <p>
                        Already have an account?

                        <a href="login.html"
                            class="text-success fw-bold text-decoration-none">
                            Sign In
                        </a>
                    </p>

                </div>

            </div>

        </div>

        </div>
    </div>


    
    <footer class="text-center py-3">

        <p class="text-secondary small">
            &copy; 2026 BorrowBox. What You Need, When You Need It.
        </p>

    </footer>

    <script>
        document.getElementById("signUpForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const fullName = document.getElementById("fullName").value.trim();
            sessionStorage.setItem("borrowboxLoginName", fullName);
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
