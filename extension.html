<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Request Extension | BorrowBox</title>
</head>
<body class="bg-light">
<div id="navbar"></div>


<main class="container my-4">
  <div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body">

      <h4 class="text-success mb-3">Request Extension</h4>

      <p class="text-secondary">
        Request more time to return your borrowed item.
      </p>

      
      <label class="form-label">Borrowed Item</label>
      <select class="form-select mb-3" aria-label="Borrowed item">
        <option>Lenovo Laptop</option>
        <option>Safety Shoes</option>
        <option>IT Textbook</option>
      </select>

      
      <label class="form-label">Current Return Date</label>
      <input type="text" class="form-control mb-3"
             value="11 November 2026" readonly>

      
      <label class="form-label">New Return Date</label>
      <input type="date" class="form-control mb-3">

      
      <label class="form-label">Reason for Extension</label>
      <textarea class="form-control mb-3" rows="3"
        placeholder="Explain why you need more time..."></textarea>

      
      <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#extensionConfirmation">
        Submit Request
      </button>

      <a href="borrowings.html"
         class="btn btn-outline-secondary">
        Cancel
      </a>

    </div>
  </div>
</main>

<div class="modal fade" id="extensionConfirmation" tabindex="-1" aria-labelledby="extensionConfirmationTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="extensionConfirmationTitle">Request submitted</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">Your extension request has been submitted successfully.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    async function loadComponent(id, file) {
      try {
        const response = await fetch(file);
        if (response.ok) document.getElementById(id).innerHTML = await response.text();
      } catch (error) {
        console.error(`Error loading ${file}:`, error);
      }
    }

    await loadComponent("navbar", "navbar.html");
    const loginProfileName = sessionStorage.getItem("borrowboxLoginName");
    const profileNameElement = document.querySelector("#navbar [data-profile-name]");
    if (loginProfileName && profileNameElement) {
      profileNameElement.textContent = loginProfileName;
      const profileInitialElement = document.querySelector("#navbar [data-profile-initial]");
      if (profileInitialElement) profileInitialElement.textContent = loginProfileName.trim().charAt(0).toUpperCase();
    }
    document.querySelector('#navbar a[href="login.html"]')?.addEventListener("click", () => sessionStorage.removeItem("borrowboxLoginName"));
    await loadComponent("footer", "footer.html");
  });
</script>

</body>
</html>
